name: Build Lumi releases

on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.platform }} ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            arch: x64
            runner: ubuntu-22.04
          - platform: linux
            arch: arm64
            runner: ubuntu-22.04-arm
          - platform: macos
            arch: x64
            runner: macos-15-intel
          - platform: macos
            arch: arm64
            runner: macos-15
          - platform: windows
            arch: x64
            runner: windows-2025
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
      - run: node scripts/build-single-executable.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: lumi-${{ matrix.platform }}-${{ matrix.arch }}
          path: release/lumi-${{ matrix.platform }}-${{ matrix.arch }}*
          if-no-files-found: error
          compression-level: 0

  publish:
    if: github.event_name == 'release'
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: lumi-*
          path: release
          merge-multiple: true
      - run: cp scripts/install.sh scripts/install.ps1 release/
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" release/* --clobber
